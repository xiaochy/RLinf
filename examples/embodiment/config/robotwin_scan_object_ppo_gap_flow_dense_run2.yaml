defaults:
  - env/robotwin_scan_object@env.train
  - env/robotwin_scan_object@env.eval
  - model/gap_flow@actor.model
  - hybrid_engines/fsdp@actor.fsdp_config
  - weight_syncer/patch_syncer@weight_syncer
  - override hydra/job_logging: stdout

hydra:
  run:
    dir: .
  output_subdir: null
  searchpath:
    - file://${oc.env:EMBODIED_PATH}/config/

cluster:
  num_nodes: 1
  component_placement:
    actor, env, rollout: 0-0

runner:
  task_type: embodied
  logger:
    log_path: "../results"
    project_name: rlinf
    experiment_name: "robotwin_scan_object_ppo_gap_flow_dense_run2"
    logger_backends: ["tensorboard"] # wandb, swanlab

  max_epochs: 40
  max_steps: -1

  only_eval: False
  val_check_interval: -1 # in-training eval off; full evals run separately on the step-20 and step-40 checkpoints
  save_interval: 4 # keep resumable (the memory guard can kill a run)

  resume_dir: null # Optional: path to a saved checkpoint directory, such as 'checkpoints/global_step_10'. If not None, it will be used to resume training.
  ckpt_path: null  # Optional: path to a .pt checkpoint. If not None, it will be loaded after the model is instantiated (for evaluation).

algorithm:
  normalize_advantages: True
  kl_penalty: kl  # how to estimate kl divergence: kl or kl_penalty
  group_size: 1
  reward_coef: 1.0


  reward_type: chunk_level
  logprob_type: chunk_level
  entropy_type: token_level

  update_epoch: 2
  adv_type: gae
  loss_type: actor_critic
  loss_agg_func: "token-mean" 
  kl_beta: 0.0
  entropy_bonus: 0
  clip_ratio_high: 0.2
  clip_ratio_low: 0.2
  clip_ratio_c: 3.0
  value_clip: 0.2
  huber_delta: 10.0

  gamma: 0.99
  gae_lambda: 0.95

  filter_rewards: False
  rewards_lower_bound: 0.1
  rewards_upper_bound: 0.9
env:
  group_name: "EnvGroup"
  enable_offload: True
  # Override the default values in env/robotwin_adjust_bottle
  train:
    rollout_epoch: 2
    total_num_envs: 6
    reward_coef: ${algorithm.reward_coef}
    max_episode_steps: 500
    max_steps_per_rollout_epoch: 512 # >= 500, multiple of num_action_chunks (16)
    group_size: ${algorithm.group_size}
    assets_path: "/project_data/held/vxiao/Bimanual_Manipulation_Project/RLinf-setup/RoboTwin-RLinf"
    seeds_path: ${oc.env:REPO_PATH}/rlinf/envs/sim/robotwin/seeds/scan_object_train_seeds.json
    center_crop: False
    svm_reward:
      enabled: True   # SVM dense reward on top of the sparse reward (coef/offset from env/robotwin_scan_object.yaml)
    task_config:
      action_type: ee   # 16-d world-frame EE pose + gripper per arm (see gen_sparse_reward_data)
      planner_backend: curobo
      embodiment: [aloha-agilex]
      camera:
        collect_wrist_camera: true
      domain_randomization:
        random_background: false
        cluttered_table: false
        clean_background_rate: 1
        random_head_camera_dis: 0
        random_table_height: 0
        random_light: false
        crazy_random_light_rate: 0
  eval:
    rollout_epoch: 1
    total_num_envs: 4
    auto_reset: True
    ignore_terminations: True
    max_episode_steps: 500
    reward_coef: ${algorithm.reward_coef}
    max_steps_per_rollout_epoch: 512 # >= 500, multiple of num_action_chunks (16)
    group_size: 1
    use_fixed_reset_state_ids: True
    is_eval: True
    assets_path: "/project_data/held/vxiao/Bimanual_Manipulation_Project/RLinf-setup/RoboTwin-RLinf"
    seeds_path: ${oc.env:REPO_PATH}/rlinf/envs/sim/robotwin/seeds/scan_object_eval_seeds.json
    video_cfg:
      save_video: False
      video_base_dir: ${runner.logger.log_path}/video/eval
    center_crop: False
    task_config:
      action_type: ee   # 16-d world-frame EE pose + gripper per arm (see gen_sparse_reward_data)
      planner_backend: curobo
      embodiment: [aloha-agilex]
      camera:
        collect_wrist_camera: true
      domain_randomization:
        random_background: false
        cluttered_table: false
        clean_background_rate: 1
        random_head_camera_dis: 0
        random_table_height: 0
        random_light: false
        crazy_random_light_rate: 0

rollout:
  group_name: "RolloutGroup"
  backend: "huggingface"
  recompute_logprobs: False
  enable_offload: True
  pipeline_stage_num: 1
  model:
    model_path: ${actor.model.model_path}
    precision: ${actor.model.precision}

actor:
  group_name: "ActorGroup"
  training_backend: "fsdp"
  micro_batch_size: 8
  global_batch_size: 192
  seed: 1234
  enable_offload: True

  # Override the default values in model/gap_flow
  model:
    model_path: "/project_data/held/vxiao/Bimanual_Manipulation_Project/GAP-flowmatch-actiononly/data/outputs/2026.10.21/01.36.20_GAP_scan_object_fm-actiononly-100demo/checkpoints/200.ckpt"
    num_action_chunks: 16 # interface for the env
    action_dim: 16
    add_value_head: True
    gap_flow:
      noise_level: 0.3
      num_steps: 10
      detach_critic_input: True

  optim:
    lr: 3.0e-07
    value_lr: 1.0e-04
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-08
    weight_decay: 0.01
    clip_grad: 1.0
    critic_warmup_steps: 0

  # Override the default values in hybrid_engines/fsdp
  fsdp_config:
    strategy: "fsdp"
    sharding_strategy: "no_shard" # same as the openpi configs; 62M params, no need to shard
    use_orig_params: True # the GAP normalizer params are frozen while the rest trains (FSDP needs this to mix them)
    gradient_checkpointing: False
    mixed_precision:
      param_dtype: ${actor.model.precision}
      reduce_dtype: ${actor.model.precision}
      buffer_dtype: ${actor.model.precision}

reward:
  use_reward_model: False

critic:
  use_critic_model: False