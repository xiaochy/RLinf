env_type: robotwin
total_num_envs: null

auto_reset: False
ignore_terminations: False

reward_coef: 1.0
use_custom_reward: True
use_rel_reward: True
center_crop: True

seed: 0
group_size: 1
use_fixed_reset_state_ids: False
max_steps_per_rollout_epoch: 500
max_episode_steps: 500 # RoboTwin official step limit for scan_object (_eval_step_limit.yml)

# Dense process reward per action chunk, added to the sparse success reward (0 after an env's episode ends):
#   r = coef * (lam * clip(logit, -beta, beta) - offset)
# Needs action_type ee, 16-step chunks and wrist cameras with depth. offset is the midpoint of the mean raw reward of
# successful (-0.146) and failed (-0.433) SFT-policy episodes measured in this env (16 episodes), i.e. the score that
# neither indicates success nor failure; the SVM README reports +0.14 / -0.31 on its own held-out set. coef is not tuned.
svm_reward:
  enabled: False
  repo_path: /project_data/held/vxiao/Bimanual_Manipulation_Project/SVM-reference
  ckpt_dir: /project_data/held/vxiao/Bimanual_Manipulation_Project/SVM-reference/checkpoints/mv-action-svm-scan-object
  model: action
  dino_repo_dir: /project_data/held/vxiao/Bimanual_Manipulation_Project/GAP-flowmatch-actiononly/thirdparty/dinov2
  dino_weights: /project_data/held/vxiao/Bimanual_Manipulation_Project/GAP-flowmatch-actiononly/pretrained/dinov2_vitl14_reg4_pretrain.pth
  lam: 0.1
  beta: 20.0
  coef: 0.2
  offset: -0.29
  batch_size: 8

is_eval: False

assets_path: "/path/to/robotwin_assets"
seeds_path: ${oc.env:REPO_PATH}/rlinf/envs/sim/robotwin/seeds/scan_object_train_seeds.json
# eval experiments: set env.eval.seeds_path=${oc.env:REPO_PATH}/rlinf/envs/sim/robotwin/seeds/scan_object_eval_seeds.json (100 expert-success seeds, disjoint from train)

video_cfg:
  save_video: True
  info_on_video: True
  video_base_dir: ${runner.logger.log_path}/video/train

enable_offload: False

task_config:
  task_name: scan_object
  step_lim: 500
  action_type: qpos  # qpos (14-d joint targets) or ee (16-d world-frame pose + gripper, per arm: xyz+quat(wxyz)+gripper)
  planner_backend: mplib # # Choices: ["curobo", "mplib"], defalut is "curobo"
  # if you want to modify the config, please check the following tutorial first:
  # https://robotwin-platform.github.io/doc/usage/configurations.html
  render_freq: 0
  episode_num: 100
  use_seed: false
  save_freq: 15
  embodiment: [piper, piper, 0.6]
  language_num: 100
  domain_randomization:
    random_background: true
    cluttered_table: true
    clean_background_rate: 0.02
    random_head_camera_dis: 0
    random_table_height: 0.03
    random_light: true
    crazy_random_light_rate: 0.02
  camera:
    head_camera_type: D435
    wrist_camera_type: D435
    collect_head_camera: true
    collect_wrist_camera: false
  data_type:
    rgb: true
    third_view: false
    depth: true  # GAP needs head-camera depth for patch 3D centers
    pointcloud: false
    observer: false
    endpose: true  # 16-d end-effector state
    qpos: true
    mesh_segmentation: false
    actor_segmentation: false
  pcd_down_sample_num: 1024
  pcd_crop: true
  save_path: ./data
  clear_cache_freq: 1
  collect_data: true
  eval_video_log: true